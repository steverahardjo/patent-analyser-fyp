<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDS08 Final Project Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1a1a2e;
            color: white;
            padding: 1rem;
            text-align: center;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .pdf-container {
            flex: 1;
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .download-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #4fd1c5;
            text-decoration: none;
        }
        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MDS08 Final Project Report</h1>
            <a href="./MDS08 Final Project Report.pdf" class="download-link" download>📥 Download PDF</a>
        </header>
        <div class="pdf-container">
            <iframe src="./MDS08 Final Project Report.pdf" title="PDF Viewer"></iframe>
        </div>
    </div>
</body>
</html>
